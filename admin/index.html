<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מערכת ניהול - Aroam Catalog</title>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="admin.css">
    <!-- PapaParse for CSV parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
</head>
<body>
    <div class="admin-layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <img src="../images/logo.png" alt="Aroam Logo" class="logo" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMDAgMTAwIj48cmVjdCB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgZmlsbD0iI2VlZSIvPjx0ZXh0IHg9IjUwIiB5PSI1NSIgZm9udC1mYW1pbHk9IkFyaWFsIiBmb250LXNpemU9IjIwIiBmaWxsPSIjOTk5IiB0ZXh0LWFuY2hvcj0ibWlkZGxlIj5Mb2dvPC90ZXh0Pjwvc3ZnPg=='">
                <h2>מערכת ניהול</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="#" class="active"><span class="icon">📦</span> ניהול מוצרים</a>
                <a href="pricelist.html"><span class="icon">💰</span> עורך המחירון הנסתר</a>
                <a href="../index.html" target="_blank"><span class="icon">🌐</span> צפייה באתר</a>
            </nav>
            <div class="sidebar-footer">
                <button id="save-all-btn" class="btn btn-primary btn-block">שמור שינויים</button>
            </div>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <div class="search-box" style="display:flex; gap:10px; align-items:center;">
                    <input type="text" id="search-input" placeholder="חיפוש מוצר...">
                    <select id="category-filter" title="סינון המוצרים בטבלה לפי קטגוריה"
                        style="padding:9px 10px; border:1px solid #ddd; border-radius:6px; background:#fff; max-width:200px;">
                        <option value="">כל הקטגוריות</option>
                    </select>
                </div>
                <div class="actions">
                    <button id="add-product-btn" class="btn btn-primary"><span class="icon">+</span> הוסף מוצר חדש</button>
                </div>
            </header>

            <div class="content-body">
                <div class="table-card">
                    <table class="products-table">
                        <thead>
                            <tr>
                                <th>תמונה</th>
                                <th>מק״ט (ID)</th>
                                <th>שם המוצר</th>
                                <th>קטגוריה</th>
                                <th>יחידה</th>
                                <th>מחיר (₪)</th>
                                <th>פעולות</th>
                            </tr>
                        </thead>
                        <tbody id="products-tbody">
                            <!-- Products will be loaded here dynamically -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Product Modal -->
    <div id="product-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">הוספת מוצר חדש</h3>
                <button class="close-btn" id="close-modal-btn">&times;</button>
            </div>
            <div class="modal-body">
                <form id="product-form">
                    <input type="hidden" id="original-id">
                    
                    <div class="form-group">
                        <label for="prod-id">מק״ט (ID) <span class="required">*</span></label>
                        <input type="text" id="prod-id" required placeholder="למשל: A123">
                    </div>

                    <div class="form-group">
                        <label for="prod-name">שם המוצר <span class="required">*</span></label>
                        <input type="text" id="prod-name" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="prod-category">קטגוריה <span class="required">*</span></label>
                            <input type="text" id="prod-category" required list="category-list">
                            <datalist id="category-list">
                                <!-- Populated dynamically -->
                            </datalist>
                        </div>
                        <div class="form-group">
                            <label for="prod-unit">יחידת מידה</label>
                            <input type="text" id="prod-unit" placeholder="למשל: יחידה, ק״ג" value="יחידה">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="prod-price">מחיר (₪) <span class="required">*</span></label>
                            <input type="number" id="prod-price" step="0.01" required>
                        </div>
                        <div class="form-group">
                            <label for="prod-packaging">אריזה / כמות בקרטון</label>
                            <input type="text" id="prod-packaging" placeholder="למשל: 12 יח׳ בקרטון">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="prod-subcategory">תת-קטגוריה (לדף SEO ייעודי)</label>
                        <select id="prod-subcategory">
                            <option value="">— ללא —</option>
                            <option value="hand-towels">נייר ניגוב ומגבות ידיים</option>
                            <option value="toilet-paper">נייר טואלט</option>
                            <option value="cups">כוסות חד פעמיות</option>
                            <option value="containers">קופסאות ואריזות מזון</option>
                            <option value="tableware">צלחות וסכו״ם חד פעמי</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="prod-description">תיאור (אופציונלי)</label>
                        <textarea id="prod-description" rows="3"></textarea>
                    </div>

                    <div class="form-group">
                        <label>תמונת מוצר</label>
                        <div class="image-upload-wrapper">
                            <img id="image-preview" src="" alt="תצוגה מקדימה" style="display: none;">
                            <div class="upload-controls">
                                <label for="prod-image-file" class="btn btn-outline">בחר קובץ מהמחשב</label>
                                <input type="file" id="prod-image-file" accept="image/*" style="display: none;">
                                <span>או</span>
                                <input type="text" id="prod-image-url" placeholder="הכנס נתיב תמונה (למשל: /images/pic.png)">
                            </div>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline" id="cancel-modal-btn">ביטול</button>
                <button type="button" class="btn btn-primary" id="save-modal-btn">שמור מוצר</button>
            </div>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="toast"></div>

    <script src="admin.js"></script>
</body>
</html>

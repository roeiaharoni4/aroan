<html lang="he" dir="rtl">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>צור קשר | אהרוני שיווק והפצה</title>
    <meta name="description"
        content="צרו קשר עם אהרוני שיווק להזמנות ובירורים. זמינים בטלפון, וואטסאפ ומייל. משלוחים לכל הארץ.">
    <link rel="canonical" href="https://aroam.co.il/contact/">
    <link rel="stylesheet" href="/css/site.css">
    <style>
        .page-header {
            background-color: var(--primary-color);
            color: var(--white);
            padding: 60px 0;
            text-align: center;
        }

        .page-header h1 {
            color: var(--white);
            margin-bottom: 15px;
        }

        .contact-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            padding: 80px 0;
        }

        @media (max-width: 768px) {
            .contact-container {
                grid-template-columns: 1fr;
            }
        }

        .contact-info-box {
            background-color: var(--white);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        .info-item {
            display: flex;
            align-items: center;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }

        .info-icon {
            width: 50px;
            height: 50px;
            background-color: var(--bg-light);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: 20px;
            font-size: 1.5rem;
            color: var(--accent-color);
        }

        .map-frame {
            width: 100%;
            height: 400px;
            border-radius: 16px;
            overflow: hidden;
            border: none;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>

<body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-W8HST8RB" height="0" width="0"
            style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <site-header></site-header>

    <div class="page-header">
        <div class="container">
            <h1>צור קשר</h1>
            <p>אנחנו כאן לכל שאלה ובקשה</p>
        </div>
    </div>

    <div class="container contact-container">
        <div class="contact-info-box">
            <h2>פרטי התקשרות</h2>
            <br>
            <div class="info-item">
                <div class="info-icon">📞</div>
                <div>
                    <strong>טלפונים:</strong><br>
                    <a href="tel:036346236">03-6346236</a><br>
                    <a href="tel:0506444290">050-6444290</a><br>
                    <a href="tel:0526000158">052-6000158</a>
                </div>
            </div>
            <div class="info-item">
                <div class="info-icon">📱</div>
                <div>
                    <strong>וואטסאפ:</strong><br>
                    <a href="https://wa.me/972526000158" target="_blank">לחץ לצ'אט מהיר</a>
                </div>
            </div>
            <div class="info-item">
                <div class="info-icon">📧</div>
                <div>
                    <strong>אימייל:</strong><br>
                    <a href="mailto:meiraroam@gmail.com">meiraroam@gmail.com</a>
                </div>
            </div>
            <div class="info-item">
                <div class="info-icon">📍</div>
                <div>
                    <strong>כתובת:</strong><br>
                    היצירה 16, אור יהודה
                </div>
            </div>
        </div>

        <div class="contact-form-container">
            <h2>שליחת הודעה מהירה</h2>
            <br>
            <form class="contact-form-ajax">
                <!-- Honeypot spam prevention -->
                <input type="text" name="_honey" style="display:none">
                <!-- Subject -->
                <input type="hidden" name="_subject" value="פנייה חדשה מעמוד צור קשר">
                
                <div class="form-group">
                    <label for="name">שם מלא <span style="color: red;">*</span></label>
                    <input type="text" id="name" name="name" required placeholder="ישראל ישראלי">
                </div>
                
                <div class="form-group">
                    <label for="phone">מספר טלפון <span style="color: red;">*</span></label>
                    <input type="tel" id="phone" name="phone" required placeholder="050-1234567">
                </div>
                
                <div class="form-group">
                    <label for="email">אימייל (אופציונלי)</label>
                    <input type="email" id="email" name="email" placeholder="name@example.com">
                </div>
                
                <div class="form-group">
                    <label for="message">הודעה / פירוט בקשה</label>
                    <textarea id="message" name="message" rows="4" placeholder="איך נוכל לעזור לכם?"></textarea>
                </div>
                
                <div class="form-status-alert"></div>
                
                <button type="submit" class="btn-form-submit">שליחת הודעה</button>
            </form>
        </div>
    </div>

    <!-- Map Section -->
    <div class="container map-section">
        <h2 style="text-align: center; margin-bottom: 30px; font-size: 1.8rem; color: var(--secondary-color);">המיקום שלנו</h2>
        <div class="map-container">
            <iframe 
                src="https://maps.google.com/maps?q=%D7%94%D7%99%D7%A6%D7%99%D7%A8%D7%94%2016%20%D7%90%D7%95%D7%A8%20%D7%99%D7%94%D7%95%D7%93%D7%94&t=&z=15&ie=UTF8&iwloc=&output=embed" 
                loading="lazy" 
                title="מפה של אהרוני שיווק והפצה באור יהודה">
            </iframe>
        </div>
    </div>

    <site-footer></site-footer>
    <script src="/js/components.js"></script>
</body>

</html>

    <meta name="robots" content="noindex, nofollow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Assistant', system-ui, sans-serif; color: #1A4231; background: #eef3ef; }
        .sheet {
            width: 210mm; min-height: 297mm; margin: 0 auto; background: #fff;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; padding: 24mm 18mm; gap: 10mm;
        }
        .logo { height: 130px; width: auto; }
        h1 { font-size: 42px; font-weight: 800; line-height: 1.15; }
        .sub { font-size: 24px; color: #4a6b58; font-weight: 600; max-width: 150mm; }
        .qr-box { border: 3px solid #639C7D; border-radius: 18px; padding: 18px; background: #fff; }
        .qr-box svg { width: 62mm; height: 62mm; display: block; }
        .scan { font-size: 26px; font-weight: 700; }
        .url { font-size: 30px; font-weight: 800; letter-spacing: 0.5px; direction: ltr; }
        .contact { font-size: 22px; color: #4a6b58; font-weight: 600; }
        .contact strong { color: #1A4231; }
        .print-hint { position: fixed; top: 12px; left: 12px; background: #639C7D; color: #fff;
            padding: 10px 18px; border-radius: 8px; font-size: 16px; cursor: pointer; border: none; font-family: inherit; }
        @media print {
            body { background: #fff; }
            .sheet { width: auto; min-height: auto; margin: 0; box-shadow: none; }
            .print-hint { display: none; }
            @page { size: A4; margin: 0; }
        }
    </style>
</head>

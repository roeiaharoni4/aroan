<!doctype html><html><head><meta charset="utf-8">
<script src="https://cdnjs.cloudflare.com/ajax/libs/opentype.js/1.3.4/opentype.min.js"></script>
<style>
@font-face{font-family:A4;src:url(assets/Assistant-400.ttf)}
@font-face{font-family:A6;src:url(assets/Assistant-600.ttf)}
@font-face{font-family:A7;src:url(assets/Assistant-700.ttf)}
@font-face{font-family:A8;src:url(assets/Assistant-800.ttf)}
.t{position:absolute;left:0;white-space:nowrap;line-height:1;font-size:1000px;font-kerning:normal;font-variant-ligatures:none}
</style>
</head><body><div id="host"></div><pre id="out">pending</pre>
<script id="items" type="application/json">__ITEMS__</script>
<script>
// Outlines text exactly as Chrome lays it out (bidi, kerning, letter-spacing) using glyph shapes from the font files.
// Each item: {name, text, weight (400|600|700|800), dir ('rtl'|'ltr'), spacing (em)}. Output paths are at font size 100,
// baseline y=0, x from the left edge of the laid-out line.
(async () => {
  const out = document.getElementById('out');
  try {
    const items = JSON.parse(document.getElementById('items').textContent);
    const fonts = {};
    for (const w of [400, 600, 700, 800]) {
      await document.fonts.load(`1000px A${w / 100}`);
      fonts[w] = opentype.parse(await (await fetch(`assets/Assistant-${w}.ttf`)).arrayBuffer());
    }
    const host = document.getElementById('host'), res = {};
    let top = 0;
    for (const it of items) {
      const el = document.createElement('span');
      el.className = 't'; el.dir = it.dir || 'rtl'; el.style.fontFamily = `A${it.weight / 100}`;
      el.style.letterSpacing = (it.spacing || 0) + 'em'; el.style.top = top + 'px'; el.textContent = it.text;
      host.appendChild(el); top += 1400;
      const font = fonts[it.weight], node = el.firstChild, x0 = el.getBoundingClientRect().left, F = 10;
      const parts = []; let minx = 1e9, maxx = -1e9;
      for (let i = 0; i < it.text.length; i++) {
        const ch = it.text[i];
        const r = document.createRange(); r.setStart(node, i); r.setEnd(node, i + 1);
        const b = r.getBoundingClientRect();
        const g = font.charToGlyph(ch);
        if (!g || g.index === 0) throw `missing glyph ${ch}`;
        const adv = g.advanceWidth * 100 / font.unitsPerEm, w = b.width / F;
        const sp = (it.spacing || 0) * 100;
        if (Math.abs(w - adv - sp) > 8 && ch !== ' ') throw `width mismatch ${ch} ${w} vs ${adv}`;
        const x = (b.left - x0) / F;
        minx = Math.min(minx, x); maxx = Math.max(maxx, x + w);
        parts.push(g.getPath(x, 0, 100).toPathData(3));
      }
      res[it.name] = { d: parts.join(' '), left: minx, right: maxx };
    }
    out.textContent = JSON.stringify(res);
  } catch (e) { out.textContent = 'ERR ' + e; }
})();
</script></body></html>

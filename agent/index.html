<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>קטלוג אהרוני - סוכן מכירות</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Heebo:wght@300;400;500;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Heebo:wght@300;400;500;700&display=swap" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Heebo:wght@300;400;500;700&display=swap"></noscript>

    <!-- Styles -->
    <link rel="stylesheet" href="/css/style.css?v=38">

    <!-- Scripts -->
    <script>
        // CONFIGURATION: AGENT VERSION
        window.CATALOG_CONFIG = {
            showPrices: true,
            allowPdf: true,
            allowShare: false,
            // הסוכן רשאי לשנות מחיר יחידה בבניית הצעת מחיר
            editablePrices: true,
            // מע״מ ועיגול לשקל — רלוונטיים רק להצעת מחיר, ולכן רק כאן
            quoteVat: true,
            // כפתור שליחה יחיד + בורר לקוח + תור אופליין (js/agent.js)
            agentMode: true,
            // הזמנות סוכן מסוננות בגיליון לפי הקידומת, בלי שינוי בסקריפט שבענן
            orderPrefix: 'SL',
            recentOrdersList: false
        };
    </script>
    <script src="/js/lib/papaparse.min.js"></script>
    <script src="/js/app.js?v=53" defer></script>
    <script src="/js/agent.js?v=1" defer></script>
</head>

<body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-W8HST8RB" height="0" width="0"
            style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->

    <!-- Login Screen -->
    <div id="login-screen"
        style="position:fixed; top:0; left:0; width:100%; height:100%; background:#f5f5f5; display:flex; flex-direction:column; justify-content:center; align-items:center; z-index:10000;">
        <div
            style="background:white; padding:2rem; border-radius:12px; box-shadow:0 4px 6px rgba(0,0,0,0.1); text-align:center; max-width:300px; width:90%;">
            <div style="margin-bottom:1rem;"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#639C7D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg></div>
            <h2 style="margin-bottom:1.5rem; color:#333;">כניסת סוכן</h2>
            <input type="password" id="agent-pin" placeholder="קוד גישה"
                style="width:100%; padding:0.8rem; border:1px solid #ddd; border-radius:8px; margin-bottom:1rem; font-size:1.1rem; text-align:center;">
            <button id="login-btn"
                style="width:100%; padding:0.8rem; background:var(--primary); color:white; border:none; border-radius:8px; font-size:1.1rem; cursor:pointer;">כניסה</button>
            <p id="login-error" style="color:red; margin-top:0.5rem; display:none;">קוד שגוי</p>
        </div>
    </div>

    <div class="app-container" id="app-content" style="display:none;">

        <!-- Header -->
        <header class="main-header">
            <div class="header-content">
                <div class="brand">
                    <img src="/images/logo.png" alt="לוגו אהרוני" class="brand-logo"
                        onerror="this.style.display='none'">
                    <h1 class="brand-name">אהרוני שיווק והפצה</h1>
                    <span
                        style="background:var(--accent); color:white; padding:2px 8px; border-radius:4px; font-size:0.8rem; margin-right:8px;">סוכן</span>
                </div>
            </div>

            <!-- שורת הלקוח הפעיל — נבנית ע"י js/agent.js -->
            <div id="agent-bar"></div>

            <div class="search-container">
                <input type="text" id="search-input" aria-label="חיפוש מוצר" class="search-input" placeholder="חיפוש מוצר...">
                <button onclick="window.APP.addCustomProduct()" class="btn btn-outline"
                    style="margin-right:10px; min-width:auto; padding:0 15px;" title="הוסף מוצר כללי"
                    aria-label="הוסף מוצר כללי"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        style="vertical-align:-4px;" aria-hidden="true">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg></button>
            </div>

            <nav class="categories-nav" id="categories">
                <!-- Categories injected by JS -->
            </nav>
        </header>

        <!-- Main Content -->
        <main>
            <div class="products-grid" id="products">
                <!-- Products injected by JS -->
            </div>
        </main>

        <!-- Floating Action Button (Cart) -->
        <div class="fab-container">
            <button id="open-order-btn" class="fab">
                <span>הצגת הזמנה</span>
                <span class="fab-badge" id="fab-count">0</span>
            </button>
        </div>

    </div>

    <!-- Order Modal -->
    <div class="modal-overlay" id="order-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">סיכום הזמנה</h2>
                <button id="close-order-btn" class="btn-close">&times;</button>
            </div>

            <div class="modal-body">

                <div id="order-date-field"
                    style="margin-bottom: 1rem; display: flex; gap: 1rem; flex-wrap: wrap; align-items: flex-end;">
                    <div id="order-date-input-wrap" style="flex: 1; min-width: 200px;">
                        <label for="order-date"
                            style="display:block; margin-bottom:0.3rem; font-size:0.9rem; color:var(--text-secondary);">תאריך
                            הזמנה:</label>
                        <input type="date" id="order-date"
                            style="padding:0.5rem; border:1px solid #ccc; border-radius:8px; width:100%;">
                    </div>
                    <div id="order-date-display" style="font-weight:600; color:var(--primary-dark); display:none;">
                    </div>
                </div>

                <div id="customer-details"
                    style="margin-bottom: 1rem; padding: 0.8rem; background: rgba(99,156,125,0.06); border-radius: 10px; display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 0.6rem;">
                    <div>
                        <label for="cust-business" style="display:block; margin-bottom:0.3rem; font-size:0.9rem; color:var(--text-secondary);">שם הלקוח <span style="color:red;">*</span></label>
                        <input type="text" id="cust-business" placeholder="שם העסק / המוסד" style="padding:0.5rem; border:1px solid #ccc; border-radius:8px; width:100%;">
                    </div>
                    <div>
                        <label for="cust-contact" style="display:block; margin-bottom:0.3rem; font-size:0.9rem; color:var(--text-secondary);">איש קשר</label>
                        <input type="text" id="cust-contact" placeholder="שם מלא" style="padding:0.5rem; border:1px solid #ccc; border-radius:8px; width:100%;">
                    </div>
                    <div>
                        <label for="cust-phone" style="display:block; margin-bottom:0.3rem; font-size:0.9rem; color:var(--text-secondary);">טלפון <span style="color:red;">*</span></label>
                        <input type="tel" id="cust-phone" placeholder="050-1234567" style="padding:0.5rem; border:1px solid #ccc; border-radius:8px; width:100%;">
                    </div>
                    <div>
                        <label for="cust-address" style="display:block; margin-bottom:0.3rem; font-size:0.9rem; color:var(--text-secondary);">כתובת לאספקה</label>
                        <input type="text" id="cust-address" placeholder="רחוב, מספר, עיר" style="padding:0.5rem; border:1px solid #ccc; border-radius:8px; width:100%;">
                    </div>
                    <div style="grid-column: 1 / -1;">
                        <label for="cust-notes" style="display:block; margin-bottom:0.3rem; font-size:0.9rem; color:var(--text-secondary);">הערות להזמנה</label>
                        <input type="text" id="cust-notes" placeholder="אופציונלי" style="padding:0.5rem; border:1px solid #ccc; border-radius:8px; width:100%;">
                    </div>
                </div>

                <div class="table-responsive" style="overflow-x: auto;">
                    <table class="order-table">
                        <thead>
                            <tr>
                                <th>תמונה</th>
                                <th>מק״ט</th>
                                <th>שם מוצר</th>
                                <th>קטגוריה</th>
                                <th>כמות</th>
                                <th>יחידה</th>
                                <th>מחיר יח׳</th>
                                <th>סה״כ</th>
                            </tr>
                        </thead>
                        <tbody id="order-table-body">
                            <!-- Order Lines injected by JS -->
                        </tbody>
                    </table>
                </div>

            </div>

            <div class="modal-footer">
                <div style="margin-left: auto; display: flex; align-items: center; gap: 1rem;">
                    <div style="text-align: right;" id="summary-total-container">
                        <div style="font-size: 0.9rem; color: #666;">סה״כ פריטים: <span id="summary-items">0</span>
                        </div>
                        <div style="font-size: 1.2rem; font-weight: 700; color: var(--primary);">סה״כ לתשלום: <span
                                id="summary-total">0.00 ₪</span></div>
                        <div id="summary-vat" style="font-size:0.9rem; color:#666; margin-top:0.2rem;"></div>
                        <label id="round-total-label"
                            style="display:flex; align-items:center; justify-content:flex-end; gap:0.35rem; font-size:0.85rem; color:#666; margin-top:0.35rem; cursor:pointer;">
                            <input type="checkbox" id="round-total" style="margin:0;"> עיגול לשקל שלם
                        </label>
                    </div>
                </div>

                <div style="display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: flex-end; width: 100%;">
                    <button id="clear-cart-btn" class="btn btn-danger">נקה הזמנה</button>
                    <button id="share-link-btn" class="btn btn-outline" style="border-color: #639C7D; color: #639C7D;"
                        onclick="window.APP.shareCartLink()">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px; margin-left:5px;" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>שתף קישור (סנכרון)
                    </button>
                    <button id="submit-order-btn" class="btn btn-success"
                        style="background:var(--primary); color:white; min-width: 170px;">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px; margin-left:5px;" aria-hidden="true"><path d="M22 2 11 13"></path><path d="M22 2 15 22l-4-9-9-4z"></path></svg>שלח הזמנה
                    </button>
                    <button id="print-pdf-btn" class="btn btn-primary"
                        style="background:var(--accent); color:white; min-width: 140px; display:none;">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px; margin-left:5px;" aria-hidden="true"><path d="M6 9V2h12v7"></path><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>הדפס הצעת מחיר (PDF)
                    </button>
                    <button id="history-btn" class="btn btn-outline" onclick="window.APP.openHistoryModal()">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px; margin-left:5px;" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>היסטוריה
                    </button>
                    <a href="/catalog-print.html" target="_blank" class="btn btn-outline"
                        style="text-decoration:none; display:flex; align-items:center; border-color:var(--text-main);">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px; margin-left:5px;" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>קטלוג מלא להדפסה
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- History Modal -->
    <div class="modal-overlay" id="history-modal">
        <div class="modal-content" style="max-width: 600px;">
            <div class="modal-header">
                <h2 class="modal-title">היסטוריית הצעות מחיר</h2>
                <button onclick="window.APP.closeHistoryModal()" class="btn-close">&times;</button>
            </div>
            <div class="modal-body" id="history-list" style="max-height: 60vh; overflow-y: auto;">
                <!-- Injected by JS -->
            </div>
            <div class="modal-footer">
                <button onclick="window.APP.closeHistoryModal()" class="btn btn-outline">סגור</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const loginScreen = document.getElementById('login-screen');
            const appContent = document.getElementById('app-content');
            const pinInput = document.getElementById('agent-pin');
            const loginBtn = document.getElementById('login-btn');
            const errorMsg = document.getElementById('login-error');

            // Simple PIN (Not secure against hackers, but good enough for average users)
            const CORRECT_PIN = "0526000158"; // Full mobile number as PIN

            // js/agent.js מחכה לזה כדי לא לפתוח את בורר הלקוח מעל מסך הקוד
            function unlock() {
                loginScreen.style.display = 'none';
                appContent.style.display = 'block';
                document.dispatchEvent(new CustomEvent('aroam:agent-unlocked'));
            }

            function checkLogin() {
                if (pinInput.value === CORRECT_PIN) {
                    localStorage.setItem('agent_logged_in', 'true');
                    unlock();
                } else {
                    errorMsg.style.display = 'block';
                }
            }

            // Check if already logged in this session
            if (localStorage.getItem('agent_logged_in') === 'true') unlock();

            loginBtn.addEventListener('click', checkLogin);
            pinInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') checkLogin();
            });
        });
    </script>

</body>

</html>
